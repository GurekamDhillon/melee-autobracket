[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
# sqlx 0.9 requires Rust 1.94.
rust-version = "1.94"

[workspace.dependencies]
bracket = { path = "crates/bracket" }
replay = { path = "crates/replay" }
proto = { path = "crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "fs"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
toml = "1"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
regex = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "registry"] }
