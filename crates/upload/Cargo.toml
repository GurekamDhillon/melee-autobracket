[package]
name = "autobracket-upload"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# A minimal signed uploader for players on another client (any-client mode): no engine, no
# Unix-only parts, so it builds on Windows, macOS and Linux.
[lib]
name = "autobracket_upload"

[[bin]]
name = "autobracket-upload"
path = "src/main.rs"

[dependencies]
proto.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
toml.workspace = true
tokio.workspace = true

[dev-dependencies]
autobracket-server = { path = "../server", features = ["testkit"] }
replay = { workspace = true, features = ["testkit"] }
bracket.workspace = true
tempfile.workspace = true
sqlx.workspace = true
reqwest.workspace = true
serde_json.workspace = true
