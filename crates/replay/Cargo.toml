[package]
name = "replay"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false

[features]
# Exposes `testkit::SlpBuilder` so other crates can fabricate replays in their tests.
testkit = []

[dependencies]
thiserror.workspace = true
sha2.workspace = true

[dev-dependencies]
# The integration tests fabricate replays with `testkit`; enabling it here means a plain
# `cargo test -p replay` builds and runs them.
replay = { path = ".", features = ["testkit"] }
