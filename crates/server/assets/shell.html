<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{title}}</title>
<link rel="icon" href="data:,">
<style>
{{style}}
</style>
</head>
<body data-page="{{page}}">
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-star" viewBox="0 0 24 24"><polygon points="12.0,2.6 14.6,9.0 21.5,9.5 16.2,14.0 17.9,20.7 12.0,17.0 6.1,20.7 7.8,14.0 2.5,9.5 9.4,9.0"/></symbol>
  <symbol id="i-burst" viewBox="0 0 100 100"><polygon points="50.0,3.0 57.4,12.7 68.0,6.6 71.1,18.4 83.2,16.8 81.6,28.9 93.4,32.0 87.3,42.6 97.0,50.0 87.3,57.4 93.4,68.0 81.6,71.1 83.2,83.2 71.1,81.6 68.0,93.4 57.4,87.3 50.0,97.0 42.6,87.3 32.0,93.4 28.9,81.6 16.8,83.2 18.4,71.1 6.6,68.0 12.7,57.4 3.0,50.0 12.7,42.6 6.6,32.0 18.4,28.9 16.8,16.8 28.9,18.4 32.0,6.6 42.6,12.7"/></symbol>
  <!-- The brand mark: a sunny burst on its hard shadow, carrying an ink bracket tree (4 to 2 to 1). -->
  <symbol id="i-mark" viewBox="-4 -4 112 112">
    <use href="#i-burst" x="5" y="6" width="100" height="100" fill="#2A1A6E" stroke="#2A1A6E" stroke-width="5" stroke-linejoin="round"/>
    <use href="#i-burst" width="100" height="100" fill="#FFD84A" stroke="#2A1A6E" stroke-width="5" stroke-linejoin="round"/>
    <path d="M25 27H40V43H25M40 35H56M25 57H40V73H25M40 65H56M56 35V65M56 50H76" fill="none" stroke="#2A1A6E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
<template id="t-star"><svg aria-hidden="true" focusable="false"><use href="#i-star"/></svg></template>
<template id="t-burst"><svg aria-hidden="true" focusable="false"><use href="#i-burst"/></svg></template>
<div class="scene" aria-hidden="true"></div>
<header class="site">
  <div class="wrap bar">
    <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 112 112" aria-hidden="true" focusable="false"><use href="#i-mark"/></svg><span class="word">Autobracket</span></a>
    <nav class="nav" aria-label="Site">
      <a href="/">Home</a>
      <a href="/schedule">Schedule</a>
      <a href="/history">History</a>
      <a href="/players">Players</a>
      <a href="/stream">Stream</a>
    </nav>
  </div>
</header>
<div class="wrap page">
<header class="top">
  <div class="top-text">
    <h1 id="title">{{title}}</h1>
    <p class="meta" id="meta"></p>
  </div>
  <div id="head-side"></div>
</header>
{{body}}
</div>
<footer class="site">
  <div class="wrap foot">
    <a class="brand small" href="/"><svg class="brand-mark" viewBox="0 0 112 112" aria-hidden="true" focusable="false"><use href="#i-mark"/></svg><span class="word">Autobracket</span></a>
    <p class="foot-line">Melee brackets that run themselves: every result is read from the players’ own replays.</p>
    <nav class="foot-nav" aria-label="More pages">
      <a href="/schedule">Schedule</a>
      <a href="/history">History</a>
      <a href="/players">Players</a>
      <a href="/stream">Stream</a>
    </nav>
  </div>
</footer>
<script>
{{script}}
</script>
</body>
</html>
